# Containerized tooling around the local-LLM setup: the proxies, and a place to add your
# own MCP servers. The inference engine itself (llama-server/llama-swap) deliberately stays
# NATIVE, not here -- Docker Desktop has no Metal GPU passthrough on Mac, and WSL (which is
# how Docker Desktop gets its performance backend on Windows) was already tried and rejected
# for the ProBook. See llm/README.md.
#
# Usage:
#   docker compose up -d                  # local-proxy only (no secrets needed)
#   docker compose --profile ocg up -d    # + the OpenCode Go bridge (needs OCG_PROXY_API_KEY)
#   docker compose --profile webui up -d open-webui   # only Open WebUI, in front of the native chain
#   docker compose down
#
# local-proxy and ocg-proxy are the same two scripts AGENTS.md already documents running
# natively (`python3 local-proxy.py &` / `./ocg-proxy.py &`) -- this just gives you a second,
# identical way to run them, same env vars, same ports, nothing in setup-agents.sh or any
# agent config needs to change either way.
#
# Do not run a proxy both ways at once (native AND here) -- two processes fighting over the
# same port, same as the existing "don't run start.sh and llama-swap against the same model"
# caution in AGENTS.md.

services:
  local-proxy:
    image: python:3.13-slim
    container_name: llm-local-proxy
    working_dir: /app
    volumes:
      - ./local-proxy.py:/app/local-proxy.py:ro
    command: ["python3", "local-proxy.py"]
    ports:
      - "${LOCAL_PROXY_PORT:-9081}:9081"
    environment:
      LOCAL_PROXY_PORT: "9081"
      # The native llama-server/llama-swap this proxy fronts runs on the HOST, not in this
      # compose file. host.docker.internal resolves to the host automatically on Mac/Windows
      # Docker Desktop; the extra_hosts line below adds it on Linux too.
      LOCAL_PROXY_UPSTREAM: "${LOCAL_PROXY_UPSTREAM:-http://host.docker.internal:9080}"
      LOCAL_PROXY_MAX_TOKENS: "${LOCAL_PROXY_MAX_TOKENS:-16384}"
      LOCAL_PROXY_KEEPALIVE_SECS: "${LOCAL_PROXY_KEEPALIVE_SECS:-10}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Anthropic Messages -> OpenAI Chat Completions bridge for OpenCode Go models (DeepSeek,
  # Kimi, GLM) under Claude Code. Needs a real API key, so it's opt-in via --profile ocg.
  ocg-proxy:
    image: python:3.13-slim
    container_name: llm-ocg-proxy
    working_dir: /app
    volumes:
      - ./ocg-proxy.py:/app/ocg-proxy.py:ro
      # Behind a TLS-intercepting corporate proxy (e.g. i9), uncomment this and the
      # SSL_CERT_FILE line below, pointed at the host's CA bundle:
      # - /etc/ssl/certs/ca-certificates.crt:/certs/ca-bundle.crt:ro
    command: ["python3", "ocg-proxy.py"]
    ports:
      - "${OCG_PROXY_PORT:-4099}:4099"
    environment:
      OCG_PROXY_PORT: "4099"
      # Required at runtime (ocg-proxy.py itself refuses and exits with a clear message if
      # this is empty) -- not enforced here with a hard ${VAR:?...} requirement, because at
      # least one Compose implementation evaluates that for every service up front, even one
      # gated behind --profile ocg, which would break plain `docker compose up -d`.
      OCG_PROXY_API_KEY: "${OCG_PROXY_API_KEY:-}"
      OCG_PROXY_UPSTREAM_URL: "${OCG_PROXY_UPSTREAM_URL:-https://opencode.ai/zen/go/v1}"
      OCG_PROXY_MODELS: "${OCG_PROXY_MODELS:-}"
      # SSL_CERT_FILE: /certs/ca-bundle.crt   # uncomment together with the volume above
    profiles: ["ocg"]
    restart: unless-stopped

  # Open WebUI: a chat UI with logins and history in front of THIS machine's chain (local-proxy
  # :9081 -> llama-swap -> engine). Start only it:  docker compose --profile webui up -d open-webui
  # Host networking because the chain listens on 127.0.0.1 only: works on Linux; on Docker Desktop
  # (Mac/Windows) enable host networking in its settings first. UI: http://127.0.0.1:3080 (the first
  # account becomes admin). The home setup with all machines behind one gateway is a separate,
  # private deployment (see llm/README.md, "Open WebUI").
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.4
    container_name: llm-open-webui
    network_mode: host
    environment:
      HOST: "127.0.0.1"
      PORT: "${OPEN_WEBUI_PORT:-3080}"
      OPENAI_API_BASE_URL: "http://127.0.0.1:${LOCAL_PROXY_PORT:-9081}/v1"
      OPENAI_API_KEY: "dummy"            # local-proxy replaces it with the real key in LAN mode
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "true"
      DEFAULT_USER_ROLE: "pending"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    volumes:
      - open-webui_data:/app/backend/data
    profiles: ["webui"]
    restart: unless-stopped

  # Add your own MCP servers here as additional services -- most ship a Docker image
  # already. Worked example (commented out, not started by default):
  #
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports: ["6333:6333"]
  #   volumes: ["./qdrant-data:/qdrant/storage"]
  #   restart: unless-stopped

volumes:
  open-webui_data:
