services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OFFLINE_MODE=True
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - ALL_PROXY=
      - all_proxy=
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal
    volumes:
      - ${HOME}/docker/openwebui/data:/app/backend/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  open-webui:
